services:
  sqlserver:
    build:
      context: .
      dockerfile: Dockerfile.sqlserver
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./js.learn.Data/database_script/LearnDB.sql:/scripts/init.sql
    entrypoint: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr & 
      sleep 30s && 
      /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -d master -i /scripts/init.sql &&
      tail -f /dev/null
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: js.learn.api
    ports:
      - "8080:80"
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=LearnDB;User=sa;Password=YourStrong!Passw0rd;

volumes:
  sqlserver_data:
